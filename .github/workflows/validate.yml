name: Validate and Package LuaSkill

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml

      # verify_skill downloads luaskills-debug, loads the skill, calls every example tool, and validates and packages
      # the skill when every bundled payload it declares is present.
      # verify_skill 下载 luaskills-debug、加载技能、调用每个示例工具，并在声明的内置载荷齐全时校验并打包。
      - name: Run complete debugger flow
        run: bash ./scripts/verify_skill.sh

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-verified-package
          path: dist/*
          if-no-files-found: ignore
