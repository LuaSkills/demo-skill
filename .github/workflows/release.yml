name: Release LuaSkill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # standard (default): one package for every system. platform: one package per system plus a package index,
  # so each system downloads only its own native libraries. Set the repository variable LUASKILLS_PACKAGE_LAYOUT
  # to "platform" to switch without editing this file.
  LUASKILLS_PACKAGE_LAYOUT: ${{ vars.LUASKILLS_PACKAGE_LAYOUT || 'standard' }}

jobs:
  # >>> demo-only
  native:
    name: Build demo-native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows selects MSVC through the default pwsh shell, which keeps Git Bash's link.exe off PATH.
      # Windows 通过默认 pwsh shell 选择 MSVC，避免 Git Bash 的 link.exe 出现在 PATH 中。
      - name: Build native library
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || '' }}
        run: python scripts/build_native.py

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/${{ matrix.platform }}/*
          if-no-files-found: error
  # <<< demo-only

  release:
    # >>> demo-only
    needs: native
    # <<< demo-only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # >>> demo-only
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Place native libraries
        shell: bash
        run: |
          for artifact_dir in native-artifacts/native-*; do
            platform="${artifact_dir##*/native-}"
            mkdir -p "native/$platform"
            cp -f "$artifact_dir"/* "native/$platform/"
          done
          rm -rf native-artifacts
      # <<< demo-only

      # The action validates the skill, fails on a missing bundled payload or a tag that differs from skill.yaml,
      # and writes the release assets with checksums.
      # 该 Action 校验技能，内置载荷缺失或标签与 skill.yaml 不一致时失败，并写出带校验和的发布资产。
      - name: Validate and package the skill
        id: package
        uses: LuaSkills/luaskills-debug@v0.8.0
        with:
          layout: ${{ env.LUASKILLS_PACKAGE_LAYOUT }}
          expect-tag: ${{ github.ref_name }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.package.outputs.out-dir }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$OUT_DIR"/*
