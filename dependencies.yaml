tool_dependencies:
  - name: rg
    version: "14.1.1"
    required: false
    scope: skill
    source:
      type: github_release
      github:
        repo: BurntSushi/ripgrep
    packages:
      windows-x64:
        archive_type: zip
        asset_name: ripgrep-14.1.1-x86_64-pc-windows-msvc.zip
        exports:
          - archive_path: rg.exe
            target_path: bin/rg.exe
      windows-arm64:
        archive_type: zip
        asset_name: ripgrep-14.1.1-aarch64-pc-windows-msvc.zip
        exports:
          - archive_path: rg.exe
            target_path: bin/rg.exe
      linux-x64:
        archive_type: tar_gz
        asset_name: ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
        exports:
          - archive_path: rg
            target_path: bin/rg
            executable: true
      linux-arm64:
        archive_type: tar_gz
        asset_name: ripgrep-14.1.1-aarch64-unknown-linux-gnu.tar.gz
        exports:
          - archive_path: rg
            target_path: bin/rg
            executable: true
      macos-x64:
        archive_type: tar_gz
        asset_name: ripgrep-14.1.1-x86_64-apple-darwin.tar.gz
        exports:
          - archive_path: rg
            target_path: bin/rg
            executable: true
      macos-arm64:
        archive_type: tar_gz
        asset_name: ripgrep-14.1.1-aarch64-apple-darwin.tar.gz
        exports:
          - archive_path: rg
            target_path: bin/rg
            executable: true
node_runtime:
  version: "24.18.0"
  package_manager: pnpm
  package_manager_version: "11.11.0"
  package_json: node/package.json
  lockfile: node/pnpm-lock.yaml
lua_dependencies: []
ffi_dependencies:
  - name: demo-native
    version: "1.0.0"
    required: false
    scope: skill
    source:
      type: bundled
    packages:
      windows-x64:
        archive_type: raw
        path: native/windows-x64/demo_native.dll
        exports:
          - archive_path: demo_native.dll
            target_path: lib/demo_native.dll
      linux-x64:
        archive_type: raw
        path: native/linux-x64/libdemo_native.so
        exports:
          - archive_path: libdemo_native.so
            target_path: lib/libdemo_native.so
      linux-arm64:
        archive_type: raw
        path: native/linux-arm64/libdemo_native.so
        exports:
          - archive_path: libdemo_native.so
            target_path: lib/libdemo_native.so
      macos-x64:
        archive_type: raw
        path: native/macos-x64/libdemo_native.dylib
        exports:
          - archive_path: libdemo_native.dylib
            target_path: lib/libdemo_native.dylib
      macos-arm64:
        archive_type: raw
        path: native/macos-arm64/libdemo_native.dylib
        exports:
          - archive_path: libdemo_native.dylib
            target_path: lib/libdemo_native.dylib
